<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0F3D91">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BuyOnBoard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">✈️ BuyOnBoard</div>
    <div class="top-buttons">
      <button id="viewMode">📋 Listă</button>
    </div>
  </header>

  <section class="search">
    <input type="text" id="searchInput" placeholder="🔍 Caută produs...">
  </section>

  <main>
    <section id="products"></section>
    <section id="cart"></section>
  </main>

  <nav class="bottomBar">
    <button id="productsBtn" class="active">
      <span class="icon">📦</span>
      Produse
    </button>
    <button id="cartBtn">
      <span class="icon">🛒</span>
      Coș
      <span id="cartBadge" class="badge">0</span>
    </button>
  </nav>

  <script src="data/products.js"></script>
  <script src="app.js"></script>
</body>
</html>
